[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-inspection-risk"
version = "0.1.0"
description = "Point-in-time ranking backtest for NYC routine restaurant inspections"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scikit-learn==1.6.1",
  "scipy==1.15.1", "joblib==1.4.2", "threadpoolctl==3.5.0",
  "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.11.13"]

[project.scripts]
inspection-risk = "inspection_risk.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
